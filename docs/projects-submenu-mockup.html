<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>APFlow Projects Submenu Mockup</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --surface: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --line: #d8dee8;
      --hover: #f2f6fb;
      --active: #e8f1ff;
      --active-text: #174ea6;
      --disabled: #9ca3af;
      --shadow: 0 18px 44px rgba(15, 23, 42, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .app-shell {
      min-height: 100vh;
      padding: 28px;
    }

    .top-nav {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 58px;
      padding: 0 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.05);
    }

    .brand {
      margin-right: 18px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .nav-item,
    .nav-trigger {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      height: 34px;
      padding: 0 10px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: #374151;
      font: inherit;
      font-size: 14px;
      white-space: nowrap;
    }

    .nav-item {
      color: var(--muted);
    }

    .nav-trigger.active {
      background: var(--active);
      color: var(--active-text);
      font-weight: 600;
    }

    .menu-wrap {
      position: relative;
    }

    .dropdown {
      position: absolute;
      top: 44px;
      left: 0;
      width: 292px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .section-label {
      padding: 8px 10px 5px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .section-label:first-child {
      padding-top: 2px;
    }

    .menu-row {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 36px;
      width: 100%;
      padding: 7px 9px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: #1f2937;
      font: inherit;
      font-size: 14px;
      text-align: left;
    }

    .menu-row:hover {
      background: var(--hover);
    }

    .menu-row.active {
      background: var(--active);
      color: var(--active-text);
      font-weight: 600;
    }

    .menu-row.disabled {
      color: var(--disabled);
      cursor: not-allowed;
    }

    .menu-row.disabled:hover {
      background: transparent;
    }

    .icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      flex: 0 0 18px;
      color: currentColor;
    }

    .chevron {
      width: 12px;
      height: 12px;
      opacity: 0.6;
    }

    .page-preview {
      margin-top: 92px;
      max-width: 920px;
      padding: 24px 0;
    }

    .page-preview h1 {
      margin: 0 0 8px;
      font-size: 24px;
      letter-spacing: 0;
    }

    .page-preview p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    @media (max-width: 760px) {
      .app-shell {
        padding: 16px;
      }

      .top-nav {
        align-items: flex-start;
        flex-wrap: wrap;
        height: auto;
        padding: 12px;
      }

      .brand {
        width: 100%;
        margin-right: 0;
      }

      .dropdown {
        left: -90px;
        width: min(292px, calc(100vw - 32px));
      }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <nav class="top-nav" aria-label="Main navigation mockup">
      <div class="brand">APFlow</div>
      <button class="nav-item" type="button">Dashboard</button>
      <button class="nav-item" type="button">Supplier</button>
      <button class="nav-item" type="button">Customer</button>
      <div class="menu-wrap">
        <button class="nav-trigger active" type="button" aria-haspopup="menu" aria-expanded="true">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 7h5l2 2h11v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
              <path d="M3 7V5a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v2"></path>
            </svg>
          </span>
          Projects
          <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="m6 9 6 6 6-6"></path>
          </svg>
        </button>

        <section class="dropdown" aria-label="Projects submenu mockup">
          <div class="section-label">Projects</div>
          <button class="menu-row active" type="button">
            <span class="icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="7" height="7"></rect>
                <rect x="14" y="3" width="7" height="7"></rect>
                <rect x="3" y="14" width="7" height="7"></rect>
                <rect x="14" y="14" width="7" height="7"></rect>
              </svg>
            </span>
            Project Dashboard
          </button>
          <button class="menu-row" type="button">
            <span class="icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M8 6h13"></path>
                <path d="M8 12h13"></path>
                <path d="M8 18h13"></path>
                <path d="M3 6h.01"></path>
                <path d="M3 12h.01"></path>
                <path d="M3 18h.01"></path>
              </svg>
            </span>
            Project Register
          </button>
          <button class="menu-row" type="button">
            <span class="icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 5v14"></path>
                <path d="M5 12h14"></path>
              </svg>
            </span>
            New Project
          </button>

          <div class="section-label">Activity</div>
          <button class="menu-row" type="button">
            <span class="icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M4 19V5"></path>
                <path d="M8 7h12l-2 4 2 4H8"></path>
              </svg>
            </span>
            Milestones
          </button>
          <button class="menu-row" type="button">
            <span class="icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 3v18h18"></path>
                <path d="m7 15 4-4 3 3 5-7"></path>
              </svg>
            </span>
            Budgets vs Actuals
          </button>
          <button class="menu-row" type="button">
            <span class="icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="6" width="18" height="14" rx="2"></rect>
                <path d="M16 6V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"></path>
              </svg>
            </span>
            Project Costs
          </button>
          <button class="menu-row" type="button">
            <span class="icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"></path>
                <path d="m9 12 2 2 4-4"></path>
              </svg>
            </span>
            Project Approvals
          </button>

          <div class="section-label">Management</div>
          <button class="menu-row" type="button">
            <span class="icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M16 3h5v5"></path>
                <path d="M8 21H3v-5"></path>
                <path d="M21 3 14 10"></path>
                <path d="M3 21l7-7"></path>
              </svg>
            </span>
            Project Edit / Add
          </button>
          <button class="menu-row" type="button">
            <span class="icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"></path>
                <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 8.6 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 8.6a1.7 1.7 0 0 0-.34-1.88l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1V3a2 2 0 1 1 4 0v.1A1.7 1.7 0 0 0 15.4 4.6a1.7 1.7 0 0 0 1.88-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9a1.7 1.7 0 0 0 .6 1 1.7 1.7 0 0 0 1.1.4h.1a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.7.6Z"></path>
              </svg>
            </span>
            Project Settings
          </button>
          <button class="menu-row disabled" type="button" aria-disabled="true">
            <span class="icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="m9 11 3 3L22 4"></path>
                <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
              </svg>
            </span>
            Projects Audit
          </button>
        </section>
      </div>
      <button class="nav-item" type="button">Reports</button>
    </nav>

    <section class="page-preview">
      <h1>Project Dashboard</h1>
      <p>This mockup shows the Projects top-nav dropdown open with grouped project, activity, and management actions.</p>
    </section>
  </main>
</body>
</html>
